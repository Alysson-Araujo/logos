<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Logos — Central de Resposta a Incidentes. Triagem por prioridade, SLA e ciclo de vida com lock otimista."
    />
    <meta name="color-scheme" content="light dark" />
    <title>Logos — Central de Resposta a Incidentes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Aplica o tema antes do primeiro paint para evitar flash de tema incorreto.
      (function () {
        try {
          var stored = window.localStorage.getItem('logos-theme');
          var preference =
            stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved = preference === 'dark' || (preference === 'system' && prefersDark);
          document.documentElement.classList.toggle('dark', resolved);
          document.documentElement.dataset.theme = resolved ? 'dark' : 'light';
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
