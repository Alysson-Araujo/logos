# ---------------------------------------------------------------------------
# Logos — Blueprint do Render (Onda 1)
#
# Sobe a API como codigo, e nao por cliques no painel: o servico fica
# reproduzivel, versionado e revisavel em PR. Sem isto, o ambiente de producao
# e um estado que so existe no painel de alguem.
#
# Uso: Render -> New -> Blueprint -> aponte para este repositorio.
# Os tres valores marcados com `sync: false` sao pedidos no painel e NUNCA
# entram no repositorio.
#
# Variaveis que NAO estao aqui (rate limit, disjuntor, timeouts de banco)
# usam os padroes do codigo em `backend/app/core/config.py`. Os valores
# recomendados para producao estao em `docs/08-deploy.md` secao 3.1.
# ---------------------------------------------------------------------------

services:
  - type: web
    name: logos-api
    runtime: python
    plan: free

    # Virginia fica ao lado do Neon em us-east-1: menos latencia por consulta.
    # O Render cobra por regiao apenas em planos pagos.
    region: virginia

    # O repositorio e um monorepo: a API vive em backend/.
    rootDir: backend

    buildCommand: pip install -e .

    # -----------------------------------------------------------------------
    # POR QUE A MIGRACAO ESTA AQUI, E NAO NO SHELL DO PAINEL
    #
    # A aplicacao NAO cria tabelas: `ensure_schema_is_migrated()` derruba a
    # subida com RuntimeError se a tabela `incidents` nao existir (o desenho
    # esta em backend/app/core/database.py). Logo, o primeiro deploy precisa
    # migrar ANTES do uvicorn escutar — senao o servico sobe doente.
    #
    # `docs/08-deploy.md` secao 2.2 manda rodar a migracao pelo Shell do Render.
    # Isso nao funciona no plano gratuito, que nao oferece Shell (e nao tem
    # disco persistente nem SSH). Colocar no startCommand resolve os dois
    # problemas de uma vez.
    #
    # Seguro enquanto houver UMA instancia, que e o que o plano free oferece.
    # Com varias replicas isto vira um passo de release separado, para nao
    # haver duas replicas migrando ao mesmo tempo — a propria secao 2.2 do
    # docs/08-deploy.md registra essa condicao.
    # -----------------------------------------------------------------------
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT

    # -----------------------------------------------------------------------
    # POR QUE /health/live, E NAO /health/ready
    #
    # A documentacao sugere /health/ready, que consulta o banco. Duas razoes
    # para nao usar:
    #
    # 1. O Neon suspende a computacao quando fica ocioso. Um health check que
    #    toca no banco pode estourar o timeout do Render durante o deploy so
    #    porque o banco estava dormindo — e o deploy e marcado como falho.
    # 2. Reiniciar o processo NAO conserta um banco fora do ar. Um health check
    #    de plataforma deve responder "o processo esta de pe?", nao "o banco
    #    esta quente?". O proprio projeto ja decidiu isso: o comentario de
    #    backend/.env.example diz que o /health/live continua respondendo com
    #    o disjuntor aberto "para a plataforma nao reiniciar o servico durante
    #    uma queda de banco".
    #
    # O /health/ready segue sendo o alvo da verificacao manual pos-deploy
    # (secao 2.5 do docs/08-deploy.md), que e onde ele faz sentido.
    # -----------------------------------------------------------------------
    healthCheckPath: /api/v1/health/live

    # `checksPass` so dispara o deploy se o CI da branch passar. O projeto ja
    # tem 3 checks obrigatorios; com `commit`, um push que quebra os testes
    # publicaria assim mesmo. (`autoDeployTrigger` substitui o `autoDeploy`,
    # que esta depreciado na especificacao.)
    autoDeployTrigger: checksPass

    # -----------------------------------------------------------------------
    # SEED: roda UMA vez, depois do primeiro deploy bem-sucedido, DENTRO do
    # ambiente do Render — que e onde as variaveis de ambiente ja estao
    # carregadas.
    #
    # Resolve os dois problemas do passo 5 da secao 2.2 do docs/08-deploy.md:
    # o plano gratuito NAO tem Shell, e rodar o seed da maquina local obrigaria
    # a copiar a credencial do Neon para um terminal.
    #
    # A ordem e segura: ele roda depois do health check passar e, portanto,
    # depois do `alembic upgrade head` do startCommand — o schema ja existe
    # quando o seed executa. E nao roda nos deploys seguintes.
    # -----------------------------------------------------------------------
    initialDeployHook: python -m app.infra.seed

    envVars:
      # Sem isto o Render usa o Python mais recente que tiver, e o
      # `.python-version` da raiz do repositorio nao e lido — o build roda
      # dentro de backend/, por causa do rootDir acima.
      - key: PYTHON_VERSION
        value: '3.12'

      - key: ENVIRONMENT
        value: production

      # Connection string do Neon, endpoint POOLED e com ?sslmode=require:
      #   postgresql+psycopg://usuario:senha@ep-xxx-pooler.us-east-1.aws.neon.tech/logos?sslmode=require
      # O prefixo `+psycopg` e obrigatorio (psycopg 3). Detalhes na secao 5.3
      # do docs/08-deploy.md.
      - key: DATABASE_URL
        sync: false

      # URL publica do front, SEM barra no final e SEM `*`.
      # Ex.: https://logos.vercel.app
      - key: CORS_ORIGINS
        sync: false

      # O Render gera um valor de 256 bits para esta chave. Melhor do que pedir
      # para colar um: elimina a chance de colar a chave de exemplo, com a qual
      # a aplicacao se RECUSA a subir em producao (backend/app/core/config.py,
      # validador _require_real_secret_in_production).
      #
      # Para gerar voce mesmo, troque por `sync: false` e use:
      #   python -c "import secrets; print(secrets.token_urlsafe(48))"
      - key: AUTH_SECRET_KEY
        generateValue: true

      # O seed roda UMA vez, da maquina local, contra o Neon — ver o runbook
      # PLANO-DEPLOY-ONDA1-LOGOS.md. Semear a cada deploy recriaria dados de
      # demonstracao por cima de dados reais.
      - key: SEED_ON_STARTUP
        value: 'false'

      # O /docs e vitrine: e por ele que o avaliador ve os 13 endpoints.
      - key: DOCS_ENABLED
        value: 'true'

      - key: LOG_LEVEL
        value: INFO
