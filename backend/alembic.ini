# ---------------------------------------------------------------------------
# Configuracao do Alembic.
#
# A URL do banco NAO fica aqui de proposito. O `alembic/env.py` a le da mesma
# fonte que a aplicacao usa (`app.core.config.Settings`), para nao existir uma
# segunda verdade sobre qual e o banco. Quem define e a variavel DATABASE_URL.
# ---------------------------------------------------------------------------

[alembic]
script_location = alembic

# Permite `import app` ao rodar o alembic a partir de backend/.
prepend_sys_path = .

version_path_separator = os

# Nome dos arquivos: 0001_esquema_inicial.py, 0002_adiciona_idempotency_keys.py
file_template = %%(rev)s_%%(slug)s

# Trunca o slug do nome da revisao para manter o nome do arquivo curto.
truncate_slug_length = 40

[post_write_hooks]

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
