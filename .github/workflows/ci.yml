name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend · lint, tipos e testes (SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Formato (ruff format)
        run: ruff format --check .

      - name: Tipos (mypy)
        run: mypy app

      - name: Testes (pytest)
        run: pytest -q

  backend-postgres:
    name: backend · testes contra PostgreSQL real
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Este job existe porque SQLite e PostgreSQL NAO tem o mesmo comportamento
    # de concorrencia. O lock otimista precisa ser validado em PostgreSQL,
    # que e o banco de producao. Ver docs/04-concorrencia-e-resiliencia.md.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: logos
          POSTGRES_PASSWORD: logos
          POSTGRES_DB: logos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U logos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql+psycopg://logos:logos@localhost:5432/logos_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Testes de integracao e concorrencia
        run: pytest -q tests/integration tests/concurrency

  frontend:
    name: frontend · lint, tipos, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A versao do pnpm vem do campo packageManager do package.json.
      # Declarar tambem aqui causa ERR_PNPM_BAD_PM_VERSION por conflito.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint (eslint)
        run: pnpm --filter web lint

      - name: Formato (prettier)
        run: pnpm exec prettier --check "frontend/src/**/*.{ts,tsx,css}"

      - name: Tipos (tsc)
        run: pnpm --filter web typecheck

      - name: Testes (vitest)
        run: pnpm --filter web test:run

      - name: Build
        run: pnpm --filter web build

  commits:
    name: conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A versao do pnpm vem do campo packageManager do package.json.
      # Declarar tambem aqui causa ERR_PNPM_BAD_PM_VERSION por conflito.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validar mensagens de commit do PR
        run: pnpm commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.sha }} --verbose
