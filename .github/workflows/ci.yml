name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend · lint, tipos e testes (SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Formato (ruff format)
        run: ruff format --check .

      - name: Tipos (mypy)
        run: mypy app

      # `alembic check` compara os modelos com o que as migracoes criam e falha
      # se houver divergencia. Sem este passo, um modelo alterado sem migracao
      # correspondente passaria na CI e explodiria no deploy.
      - name: Schema (alembic upgrade + check)
        run: |
          alembic upgrade head
          alembic check

      - name: Testes (pytest)
        run: pytest -q

  backend-postgres:
    name: backend · testes contra PostgreSQL real
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Este job existe porque SQLite e PostgreSQL NAO tem o mesmo comportamento
    # de concorrencia. O lock otimista precisa ser validado em PostgreSQL,
    # que e o banco de producao. Ver docs/04-concorrencia-e-resiliencia.md.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: logos
          POSTGRES_PASSWORD: logos
          POSTGRES_DB: logos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U logos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql+psycopg://logos:logos@localhost:5432/logos_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Testes de integracao e concorrencia
        run: pytest -q tests/integration tests/concurrency

  frontend:
    name: frontend · lint, tipos, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A versao do pnpm vem do campo packageManager do package.json.
      # Declarar tambem aqui causa ERR_PNPM_BAD_PM_VERSION por conflito.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint (eslint)
        run: pnpm --filter web lint

      - name: Formato (prettier)
        run: pnpm exec prettier --check "frontend/src/**/*.{ts,tsx,css}"

      - name: Tipos (tsc)
        run: pnpm --filter web typecheck

      - name: Testes (vitest)
        run: pnpm --filter web test:run

      - name: Build
        run: pnpm --filter web build

  e2e:
    name: e2e · navegador real (Cypress)
    runs-on: ubuntu-latest

    # Terceiro nível da pirâmide: o que os testes de componente e de integração
    # não alcançam — a página montada, o clique de verdade e o `409` chegando na
    # tela. `pnpm e2e` sobe banco SQLite descartável, API e front compilado; ver
    # `scripts/e2e.mjs`.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      # A versao do pnpm vem do campo packageManager do package.json.
      # Declarar tambem aqui causa ERR_PNPM_BAD_PM_VERSION por conflito.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: |
          pnpm install --frozen-lockfile
          python -m pip install --upgrade pip
          pip install -e "backend[dev]"

      # Electron precisa destas bibliotecas mesmo sem tela. O nome do pacote de
      # audio muda entre 22.04 e 24.04 (`libasound2` / `libasound2t64`), e o
      # runner pode ser qualquer um dos dois.
      - name: Bibliotecas do Electron
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libnss3 libgbm1 libxss1 libxtst6
          sudo apt-get install -y --no-install-recommends libasound2t64 || sudo apt-get install -y --no-install-recommends libasound2

      # O binário do Cypress sai do cache do usuário; a chave carrega o lockfile
      # para que uma atualização do Cypress invalide o cache.
      - name: Guardar o binario do Cypress
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Subir a aplicacao e rodar o E2E
        run: pnpm e2e

      - name: Publicar videos e prints da falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artefatos
          path: |
            frontend/cypress/videos
            frontend/cypress/screenshots
          retention-days: 7
          if-no-files-found: ignore

  commits:
    name: conventional commits
    # Fica de fora dos PRs do Dependabot: a mensagem do commit e gerada pela
    # ferramenta (e inclui o nome do grupo de atualizacao), estourando o limite
    # de 72 caracteres do cabecalho — algo que o autor do PR nao controla.
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A versao do pnpm vem do campo packageManager do package.json.
      # Declarar tambem aqui causa ERR_PNPM_BAD_PM_VERSION por conflito.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validar mensagens de commit do PR
        run: pnpm commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.sha }} --verbose
